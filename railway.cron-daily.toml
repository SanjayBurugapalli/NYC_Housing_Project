# Railway config for the DAILY data refresh cron service.
#
# Runs the fast-moving datasets (complaints, violations, rodent inspections)
# plus scoring every day at 04:00 UTC (~midnight ET). For slower datasets
# (PLUTO, litigations, evictions, registrations) see railway.cron-weekly.toml.
#
# To use: create a new Railway service in this project, set its
# "Config-as-code path" to railway.cron-daily.toml, and copy DATABASE_URL
# (and any other puller env vars) from the backend service.

[build]
dockerfilePath = "Dockerfile.cron"

[deploy]
startCommand = "python data/refresh.py --datasets=311_complaints,hpd_violations,hpd_complaints,dob_violations,dob_complaints,rodent"
cronSchedule = "0 4 * * *"
restartPolicyType = "never"
