# Railway config for the data refresh cron service.
#
# Runs every registered puller plus scoring once per day at 04:00 UTC
# (~midnight ET). One job is simpler to operate than a daily/weekly split;
# the slow-moving pullers (PLUTO, litigations, etc.) add only a few minutes
# per run. Split this out again only if a dataset starts dominating runtime
# or you hit a Socrata rate limit.
#
# Wired in the Railway dashboard as the "refresh-daily" service with
# Config-as-code path set to this file.

[build]
dockerfilePath = "Dockerfile.cron"

[deploy]
startCommand = "python data/refresh.py"
cronSchedule = "0 4 * * *"
restartPolicyType = "never"
