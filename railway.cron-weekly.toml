# Railway config for the WEEKLY data refresh cron service.
#
# Runs the slow-moving datasets (PLUTO, litigations, evictions, owner
# registrations) plus scoring every Sunday at 05:00 UTC. Scoring runs again
# here so PLUTO/registration changes feed into the next score snapshot.
#
# To use: create a new Railway service in this project, set its
# "Config-as-code path" to railway.cron-weekly.toml, and copy DATABASE_URL
# (and any other puller env vars) from the backend service.

[build]
dockerfilePath = "Dockerfile.cron"

[deploy]
startCommand = "python data/refresh.py --datasets=litigations,evictions,registrations,pluto"
cronSchedule = "0 5 * * 0"
restartPolicyType = "never"
